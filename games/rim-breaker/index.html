<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リム・ブレイカー | ゲッタ〜クソゲーの墓場</title>
  <link rel="stylesheet" href="../../assets/site.css?v=2">
  <link rel="stylesheet" href="./style.css?v=3">
  <script src="./game.js?v=4" defer></script>
</head>
<body class="game-surface">
  <main>
    <nav><a href="../../">← ゲーム一覧</a><button id="sound" type="button" aria-pressed="true">効果音 ON</button></nav>
    <header>
      <h1>リム・ブレイカー</h1>
      <p>光る端で返すと着弾が爆発。マークのあるブロックに球が直撃すると、分裂・貫通・超反射・ビームが発動。</p>
    </header>
    <section class="cabinet" aria-label="リム・ブレイカーの操作画面">
      <dl class="hud">
        <div><dt>セクター</dt><dd id="sector">01</dd></div>
        <div><dt>残機</dt><dd id="lives">3</dd></div>
        <div><dt>スコア</dt><dd id="score">0</dd></div>
        <div><dt>ベスト</dt><dd id="best">0</dd></div>
      </dl>
      <div class="playfield">
        <canvas id="board" width="480" height="470" aria-label="ブロック崩しの盤面"></canvas>
        <div id="overlay" class="overlay" hidden>
          <section class="card" aria-labelledby="overlay-title">
            <h2 id="overlay-title" tabindex="-1"></h2>
            <p id="overlay-copy"></p>
            <div id="choices"></div>
          </section>
        </div>
      </div>
      <div class="controls">
        <button id="action" type="button">発射</button>
        <button id="pause" type="button">一時停止</button>
        <p id="status" role="status">盤面をタップして発射。</p>
      </div>
    </section>
    <p class="help">タップまたは Space で発射。パドルはドラッグ・マウス・← → で移動。P で一時停止。</p>
  </main>
</body>
</html>
