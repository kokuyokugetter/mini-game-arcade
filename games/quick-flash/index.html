<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111624">
  <title>フラッシュ反射測定 | ゲッタ〜クソゲーの墓場</title>
  <link rel="stylesheet" href="../../assets/site.css?v=2">
  <link rel="stylesheet" href="./style.css?v=1">
  <link rel="stylesheet" href="../../assets/result.css?v=1">
  <script src="../../assets/result.js?v=1" defer></script>
  <script src="./game.js?v=2" defer></script>
</head>
<body class="game-surface">
  <main>
    <a class="back" href="../../">← ゲーム一覧</a>
    <header>
      <h1>フラッシュ反射測定</h1>
      <p>光った瞬間に押す。3回の平均で自己ベストに挑戦。</p>
    </header>
    <div class="hud">
      <span id="round">1 / 3</span>
      <span>ベスト <strong id="best">—</strong></span>
    </div>
    <button type="button" id="pad" data-state="ready" aria-describedby="instruction">
      <span class="target" aria-hidden="true"><span></span></span>
      <span id="headline">測定スタート</span>
      <span id="detail">タップ / Space</span>
    </button>
    <ol class="results" aria-label="各回の記録">
      <li><span>1回目</span><strong id="result-1">—</strong></li>
      <li><span>2回目</span><strong id="result-2">—</strong></li>
      <li><span>3回目</span><strong id="result-3">—</strong></li>
    </ol>
    <p id="instruction">黄緑に光るまで待ってからタップ。フライングはその回をやり直し。</p>
    <p id="announcement" class="sr-only" role="status"></p>
  </main>
</body>
</html>
