<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>境界の魔王 | ミニゲームアーケード</title>
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main>
    <a href="../../">← ゲーム一覧</a>
    <header>
      <h1>境界の魔王</h1>
      <p>橋が落ち、村から人が消えた。残された地図を手に、魔王城へ向かう。</p>
    </header>
    <section class="screen" aria-label="ゲーム画面">
      <canvas id="scene" width="272" height="144" aria-label="草原と川を隔てて城がある地図"></canvas>
      <div class="status">
        <h2 id="area" tabindex="-1">渡し場の村</h2>
        <span id="stats"></span>
      </div>
    </section>
    <p id="message" class="message" role="status"></p>
    <section id="field" aria-label="移動操作">
      <p class="keys-help">矢印キー・方向ボタンで移動</p>
      <div class="field-controls">
        <div class="directions" aria-label="方向">
          <button type="button" data-dir="up" aria-label="上">↑</button>
          <button type="button" data-dir="left" aria-label="左">←</button>
          <button type="button" data-dir="down" aria-label="下">↓</button>
          <button type="button" data-dir="right" aria-label="右">→</button>
        </div>
        <button id="inspect" type="button">足元を調べる</button>
      </div>
    </section>
    <section id="battle" class="commands" aria-label="戦闘コマンド" hidden>
      <button id="attack" type="button">攻撃</button>
      <button id="guard" type="button">防御</button>
      <button id="shield" type="button">盾を外す</button>
      <button id="heal" type="button">薬草</button>
      <button id="reflect" type="button" hidden>呪文を反射</button>
      <button id="restore" type="button" hidden>村人の記録を返す</button>
    </section>
    <section id="ending" class="commands" aria-label="再開" hidden>
      <button id="retry" type="button">魔王戦をやり直す</button>
      <button id="restart" type="button">村からやり直す</button>
    </section>
    <details id="hints">
      <summary>ヒント</summary>
      <ol id="hint-list"></ol>
    </details>
  </main>
</body>
</html>
