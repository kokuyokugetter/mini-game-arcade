<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>境界の魔王 | ゲッタ〜クソゲーの墓場</title>
  <link rel="stylesheet" href="../../assets/site.css?v=2">
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./game.js?v=2" defer></script>
</head>
<body>
  <main>
    <a href="../../">← ゲーム一覧</a>
    <header>
      <h1>境界の魔王</h1>
      <p>村から人が消えた。橋を渡って魔王に挑むか、地図に残った異変を追うか。</p>
    </header>
    <section class="screen game-surface" aria-label="ゲーム画面">
      <canvas id="scene" width="272" height="144" aria-label="草原と川を隔てて城がある地図"></canvas>
      <div class="status">
        <h2 id="area" tabindex="-1">渡し場の村</h2>
        <span id="stats"></span>
      </div>
    </section>
    <p id="message" class="message game-surface" role="status"></p>
    <section id="field" class="game-surface" aria-label="移動操作">
      <p class="keys-help">矢印キー・方向ボタンで移動</p>
      <div class="field-controls">
        <div class="directions" aria-label="方向">
          <button type="button" data-dir="up" aria-label="上">↑</button>
          <button type="button" data-dir="left" aria-label="左">←</button>
          <button type="button" data-dir="down" aria-label="下">↓</button>
          <button type="button" data-dir="right" aria-label="右">→</button>
        </div>
        <button id="inspect" type="button">足元を調べる</button>
      </div>
    </section>
    <section id="battle" class="game-surface" aria-label="戦闘コマンド" hidden>
      <p id="tell" class="tell" role="status"></p>
      <div class="commands">
        <button id="attack" type="button">攻撃</button>
        <button id="guard" type="button">防御</button>
        <button id="heal" type="button">薬草</button>
        <button id="shield" type="button">盾を外す</button>
        <button id="leave" type="button">門前へ戻る</button>
      </div>
      <div class="commands discoveries">
        <button data-route="sword" type="button" hidden></button>
        <button data-route="wrap" type="button" hidden></button>
        <button data-route="shield" type="button" hidden></button>
        <button data-route="ledger" type="button" hidden></button>
        <form id="passphrase" hidden>
          <label for="password">玉座の合言葉</label>
          <input id="password" type="text" maxlength="24" autocomplete="off" spellcheck="false">
          <button type="submit">入力する</button>
        </form>
      </div>
    </section>
    <section id="ending" class="commands game-surface" aria-label="再開" hidden>
      <button id="retry" type="button">もう一度、魔王に挑む</button>
      <button id="restart" type="button">村からやり直す</button>
    </section>
    <details class="game-surface">
      <summary id="journal-summary">バグ図鑑</summary>
      <ul id="journal"></ul>
    </details>
    <details>
      <summary>ヒント</summary>
      <div id="hint-list"></div>
    </details>
  </main>
</body>
</html>
