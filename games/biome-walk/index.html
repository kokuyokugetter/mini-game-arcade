<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182e29">
  <title>まっすぐ、どこまでも | ゲッタ〜クソゲーの墓場</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main>
    <canvas id="world" aria-label="まっすぐな道の先に広がる、立体的なバイオームの風景"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header>
      <a href="../../" class="back">ゲーム一覧</a>
      <div class="brand"><span>AN ENDLESS LITTLE JOURNEY</span><h1>まっすぐ、どこまでも</h1></div>
      <button id="journal-open" class="glass">旅の手帖 <span id="collection">1 / 10</span></button>
    </header>
    <section class="location" aria-label="現在の地帯">
      <p class="eyebrow" id="region-number">LANDSCAPE 01</p>
      <h2 id="region">はじまりの草原</h2>
      <p id="description">緑の草と、小さな花。旅はここから。</p>
      <div class="progress"><span id="progress-fill"></span></div>
      <p class="next" id="next">次の風景まで あと42歩</p>
    </section>
    <div id="arrival" class="arrival" role="status" aria-live="polite"></div>
    <footer>
      <div class="distance"><strong id="steps">0</strong><span>歩の旅</span><small id="visits">訪れた地帯 1</small></div>
      <div class="walking-controls">
        <p id="hint">道はひとつ。行き先は、まだ知らない。</p>
        <div class="buttons"><button id="walk">長押しで歩く <kbd>W / ↑ / Space</kbd></button><button id="auto" class="glass" aria-pressed="false">自動で歩く</button></div>
      </div>
      <button id="motion" class="glass motion" aria-pressed="false">揺れ OFF</button>
    </footer>
    <dialog id="journal" aria-labelledby="journal-title">
      <div class="journal-heading"><div><p class="eyebrow">COLLECTED LANDSCAPES</p><h2 id="journal-title">旅の手帖</h2></div><button id="journal-close" aria-label="手帖を閉じる">閉じる</button></div>
      <p>出会った風景を、ひとつずつ。この端末に旅を自動保存します。</p>
      <div id="entries" class="entries"></div>
      <p id="save-status" class="save-status"></p>
    </dialog>
    <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
  </main>
</body>
</html>
