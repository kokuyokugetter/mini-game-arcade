<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d2c">
  <title>パルス・ブリッジ | ゲッタ〜クソゲーの墓場</title>
  <link rel="stylesheet" href="../../assets/site.css?v=2">
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./view.js?v=2" defer></script>
  <script src="./game.js?v=2" defer></script>
</head>
<body class="game-surface">
  <main>
    <nav>
      <a href="../../">← ゲーム一覧</a>
      <button id="sound" type="button" aria-pressed="true">効果音 ON</button>
    </nav>
    <header>
      <h1>パルス・ブリッジ</h1>
      <p>ギリギリでかわして、巨像の装甲をぶち抜け。</p>
    </header>
    <section class="cabinet" aria-label="ゲーム画面">
      <dl class="hud">
        <div><dt>機体</dt><dd id="units">8</dd></div>
        <div><dt>連続回避</dt><dd id="chain">×0</dd></div>
        <div><dt>スコア</dt><dd id="score">0</dd></div>
        <div><dt>ベスト</dt><dd id="best">0</dd></div>
      </dl>
      <progress id="run-progress" aria-label="橋の進行度" max="100" value="0"></progress>
      <div class="field">
        <canvas id="board" width="480" height="610" tabindex="0" aria-label="部隊を左右に動かす海上の橋。指でドラッグ、または左右の矢印キーで操作できます。"></canvas>
        <div class="overlay" id="overlay">
          <div class="card">
            <h2 id="overlay-title" tabindex="-1">出撃準備</h2>
            <p id="overlay-copy">青いゲートで増援。赤い帯をギリギリでかわしてパルスを溜め、巨像のコアに合わせて撃て！</p>
            <button id="start" type="button">出撃する</button>
          </div>
        </div>
      </div>
      <button id="pulse" type="button" disabled>パルス砲 75%</button>
      <div class="controls">
        <p id="status" role="status">左右移動はドラッグ・← →。パルス砲はボタン・Space。</p>
        <button id="pause" type="button" disabled>一時停止</button>
      </div>
    </section>
  </main>
</body>
</html>
