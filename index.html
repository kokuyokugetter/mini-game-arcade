<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ミニゲームアーケード</title>
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body>
  <main>
    <header>
      <h1>ミニゲームアーケード</h1>
      <p>ブラウザで遊べるミニゲーム集。</p>
    </header>
    <section aria-labelledby="games-heading">
      <h2 id="games-heading">ゲーム一覧</h2>
      <ul class="games">
        <li>
          <h3><a href="./games/pref-puzzle/">都道府県パズル</a></h3>
          <p>都道府県を落とし、隣り合う県を合体させるパズル。</p>
        </li>
        <li>
          <h3><a href="./games/piano-chords/">ピアノ音当て</a></h3>
          <p>ピアノ風の音を聴き、オクターブまで当てる1〜5音のクイズ。</p>
        </li>
        <li>
          <h3><a href="./games/bug-quest/">境界の魔王</a></h3>
          <p>地図や戦闘のバグを見つけて魔王に挑む、ドット絵の短編RPG。</p>
        </li>
        <li>
          <h3><a href="./games/rim-breaker/">リム・ブレイカー</a></h3>
          <p>パドルの端で爆発する球を返し、装備を選びながら進むエンドレスブロック崩し。</p>
        </li>
        <li>
          <h3><a href="./games/cleaning-room/">スッキリ洗浄室</a></h3>
          <p>タイルやコンロの汚れを水で吹き飛ばす、エンドレス洗浄ゲーム。</p>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
